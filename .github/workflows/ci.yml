name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela corridas anteriores de la misma rama/PR para ahorrar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Gates obligatorios (verdes hoy) ---
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      # --- Pasos informativos (no bloqueantes) ---
      # El proyecto usa tipado laxo y ESLint tiene findings preexistentes.
      # Se reportan para visibilidad sin frenar el merge; quitar continue-on-error
      # a medida que se vayan limpiando.
      - name: Type check (informativo)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint (informativo)
        run: npx eslint .
        continue-on-error: true
